name: Custom Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Init paths
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\tdesktop

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Cache: ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles(format('{0}/tdesktop/Telegram/build/prepare/prepare.py', env.TBUILD)) }}

      - name: Cache: Libraries
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.os }}-libraries-${{ hashFiles(format('{0}/tdesktop/Telegram/build/prepare/prepare.py', env.TBUILD)) }}

      - name: Prepare Libraries
        run: |
          cd %TBUILD%
          tdesktop\Telegram\build\prepare\win.bat skip-release silent

      - name: Configure Build
        run: |
          cd %TBUILD%\tdesktop\Telegram
          call configure.bat x64 ^
            -D CMAKE_C_FLAGS="/WX" ^
            -D CMAKE_CXX_FLAGS="/WX" ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
            -D DESKTOP_APP_NO_PDB=ON

      - name: Build Project
        run: cmake --build %TBUILD%\tdesktop\out --config Release

      - name: Package ZIP
        run: |
          cd %TBUILD%\tdesktop\out\Release
          mkdir artifact
          copy Telegram.exe artifact\
          powershell -Command "Compress-Archive -Path artifact\* -DestinationPath telegram-windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-windows
          path: %TBUILD%\tdesktop\out\Release\telegram-windows.zip

  build-macos:
    runs-on: macos-13

    steps:
      - name: Get repository name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: Setup Homebrew + Deps
        run: |
          brew update
          brew install automake meson nasm ninja pkg-config create-dmg
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache: ThirdParty
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: macos-thirdparty-${{ hashFiles(format('{0}/Telegram/build/prepare/prepare.py', env.REPO_NAME)) }}

      - name: Cache: Libraries
        uses: actions/cache@v4
        with:
          path: Libraries
          key: macos-libraries-${{ hashFiles(format('{0}/Telegram/build/prepare/prepare.py', env.REPO_NAME)) }}

      - name: Prepare Libraries
        run: ./tdesktop/Telegram/build/prepare/mac.sh skip-release silent

      - name: Configure
        run: |
          cd $REPO_NAME/Telegram
          ./configure.sh \
            -D CMAKE_C_FLAGS="-Werror" \
            -D CMAKE_CXX_FLAGS="-Werror" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build Project
        run: |
          cd $REPO_NAME/out
          xcodebuild -project Telegram.xcodeproj -scheme Telegram -configuration Release -arch arm64

      - name: Package DMG
        run: |
          cd $REPO_NAME/out/Release
          create-dmg --volname "Telegram" \
            --window-size 800 400 \
            --icon "Telegram.app" 200 190 \
            --app-drop-link 600 185 \
            Telegram.dmg Telegram.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: telegram-macos
          path: ${{ env.REPO_NAME }}/out/Release/Telegram.dmg
